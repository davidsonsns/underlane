[package]
name = "underlane"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Menu bar app for running cloudflared tunnels"

[[bin]]
name = "Underlane"
path = "src/main.rs"

[lib]
name = "underlane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Loopback control server used by the end-to-end check. Never in `make build`.
e2e = ["dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:uuid"]

[dependencies]
underlane-core = { path = "../../../crates/underlane-core" }
anyhow = "1"
base64 = "0.22"
bytes = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"], optional = true }
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSError", "NSObject", "NSUserDefaults", "NSAppleEventManager", "NSAppleEventDescriptor", "NSData", "objc2-core-services"] }
objc2-service-management = { version = "0.3", features = ["SMAppService", "objc2-foundation"] }
objc2-app-kit = { version = "0.3", features = ["NSStatusItem", "NSStatusBar", "NSStatusBarButton", "NSButton", "NSControl", "NSResponder", "NSView", "NSApplication", "NSImage"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "3"
tauri-plugin-autostart = "2"
